<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <title>Stickman Clash</title>
        <link rel="shortcut icon" href="../../default/2020/TemplateData/favicon.ico">
        <link rel="stylesheet" href="../../default/2020/TemplateData/style.css">
		<!-- <script src="https://m.igroutka.ru/files/scripts/sdk/crazy.js"></script>
		<script src="https://m.igroutka.ru/files/scripts/sdk/crazygames-sdk-v2.js"></script> -->
    </head>
    <body class="dark">
        <div id="unity-container" class="unity-desktop">
            <canvas id="unity-canvas"></canvas>
        </div>
        <div id="unity-fullscreen-button" style="display: none;"></div>
        <div id="loading-cover" style="display:none;">
            <div id="unity-loading-bar">
                <!--<div id="unity-logo">
                    <img src="logo.png">
                </div>-->
                <div id="unity-progress-bar-empty" style="display: none;">
                    <div id="unity-progress-bar-full"></div>
                </div>
                <div class="spinner"></div>
            </div>
        </div>
        <script>
            (()=>{const caps=[];window._caps=caps;
            for(const C of [WebGLRenderingContext,WebGL2RenderingContext]){
            const c=C.prototype.compressedTexImage2D;
            C.prototype.compressedTexImage2D=function(t,l,f,w,h,b,d,...r){
            if(l===0&&w>=32&&d&&d.byteLength)caps.push({k:'c',f,w,h,d:d.slice()});
            return c.call(this,t,l,f,w,h,b,d,...r)};
            const x=C.prototype.texImage2D;
            C.prototype.texImage2D=function(t,l,fi,w,h,b,f,ty,d){
            if(arguments.length>=9&&l===0&&d&&d.byteLength&&w>=32&&f===0x1908)caps.push({k:'r',f,w,h,d:d.slice()});
            return x.apply(this,arguments)};
            }
            window.dl=async()=>{
            const meta=caps.map(c=>({k:c.k,f:c.f,w:c.w,h:c.h,n:c.d.byteLength}));
            const hb=new TextEncoder().encode(JSON.stringify(meta));
            const blob=await new Response(new Blob([new Uint32Array([hb.length]),hb,...caps.map(c=>c.d)]).stream().pipeThrough(new CompressionStream('gzip'))).blob();
            const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tex_capture.bin.gz';a.click();
            console.log(caps.length,'textures');};
            })();
            </script>
        <script>
            const hideFullScreenButton = "";
            const buildUrl = "Build/";
            const loaderUrl = buildUrl + "Webgl.loader.js";
            const config = {
                dataUrl: buildUrl + "Webgl.data",
                frameworkUrl: buildUrl + "Webgl.framework.js",
                codeUrl: buildUrl + "Webgl.wasm",
                streamingAssetsUrl: "StreamingAssets",
            };

            const container = document.querySelector("#unity-container");
            const canvas = document.querySelector("#unity-canvas");
            const loadingCover = document.querySelector("#loading-cover");
            const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
            const progressBarFull = document.querySelector("#unity-progress-bar-full");
            const fullscreenButton = document.querySelector("#unity-fullscreen-button");
            const spinner = document.querySelector('.spinner');

            const canFullscreen = (function() {
                for (const key of ['exitFullscreen', 'webkitExitFullscreen', 'webkitCancelFullScreen', 'mozCancelFullScreen', 'msExitFullscreen', ]) {
                    if (key in document) {
                        return true;
                    }
                }
                return false;
            }());

            if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                container.className = "unity-mobile";
                config.devicePixelRatio = 1;
            }
            loadingCover.style.display = "";
            var newInstance = null;

            const script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = ()=>{
                createUnityInstance(canvas, config, (progress)=>{
                    spinner.style.display = "none";
                    progressBarEmpty.style.display = "";
                    progressBarFull.style.width = `${100 * progress}%`;
                }
                ).then((unityInstance)=>{
                    newInstance = unityInstance;
                    loadingCover.style.display = "none";
                    if (canFullscreen) {
                        if (!hideFullScreenButton) {
                            fullscreenButton.style.display = "";
                        }
                        fullscreenButton.onclick = ()=>{
                            newInstance.SetFullscreen(1);
                        }
                        ;
                    }
                }
                ).catch((message)=>{
                    alert(message);
                }
                );
            };
            
			
            document.body.appendChild(script);
        </script>
    </body>
</html>
