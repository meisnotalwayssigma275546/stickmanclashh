<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <title>Stickman Clash</title>
        <link rel="shortcut icon" href="../../default/2020/TemplateData/favicon.ico">
        <link rel="stylesheet" href="../../default/2020/TemplateData/style.css">

        <script>
            // Mock the CrazyGames SDK object to prevent initialization loops and stack overflows
            window.CrazyGames = {
                SDK: {
                    gameplayStart: function() { console.log("Mock: gameplayStart called"); },
                    gameplayStop: function() { console.log("Mock: gameplayStop called"); },
                    loadingStart: function() { console.log("Mock: loadingStart called"); },
                    loadingStop: function() { console.log("Mock: loadingStop called"); },
                    happyTime: function() {},
                    ad: {
                        requestAd: function(type, callbacks) {
                            if (callbacks && callbacks.complete) callbacks.complete();
                            if (callbacks && callbacks.reward) callbacks.reward();
                        }
                    },
                    user: {
                        getUser: function() { return Promise.resolve(null); },
                        showAuthPrompt: function() { return Promise.resolve(null); }
                    },
                    data: {
                        setItem: function(key, val) { localStorage.setItem(key, val); },
                        getItem: function(key) { return Promise.resolve(localStorage.getItem(key)); }
                    }
                }
            };

            // Prevent cross-origin parent window security crashes if the game checks window.parent
            if (window.self === window.top) {
                window.parent = window;
            }
        </script>
    </head>
    <body class="dark">
        <div id="unity-container" class="unity-desktop">
            <canvas id="unity-canvas"></canvas>
        </div>
        <div id="unity-fullscreen-button" style="display: none;"></div>
        <div id="loading-cover" style="display:none;">
            <div id="unity-loading-bar">
                <div id="unity-progress-bar-empty" style="display: none;">
                    <div id="unity-progress-bar-full"></div>
                </div>
                <div class="spinner"></div>
            </div>
        </div>
        <script src="mod.js"></script>
        <script>
        (() => {
            const w = WebAssembly, oi = w.instantiate, os = w.instantiateStreaming;
            const grab = r => {
                const i = r.instance || r;
                if (i && i.exports) {
                    window._ex = i.exports;
                    window._tbl = i.exports.Wi;
                    window._mem = i.exports.yi;
                }
                return r;
            };
            w.instantiate = function(...a) { return oi.apply(this, a).then(grab); };
            if (os) w.instantiateStreaming = function(...a) { return os.apply(this, a).then(grab); };
        })();
        </script>
        <script>
            const hideFullScreenButton = "";
            const buildUrl = "Build/";
            const loaderUrl = buildUrl + "WebglLoader.js";

            const config = {
                dataUrl: buildUrl + "Webgl.data",
                frameworkUrl: buildUrl + "Webgl.framework.js",
                codeUrl: buildUrl + "Webgl.wasm",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Unity",
                productName: "Stickman Clash",
                productVersion: "1.0",
            };

            const container = document.querySelector("#unity-container");
            const canvas = document.querySelector("#unity-canvas");
            const loadingCover = document.querySelector("#loading-cover");
            const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
            const progressBarFull = document.querySelector("#unity-progress-bar-full");
            const fullscreenButton = document.querySelector("#unity-fullscreen-button");
            const spinner = document.querySelector('.spinner');

            const canFullscreen = (function() {
                for (const key of ['exitFullscreen', 'webkitExitFullscreen', 'webkitCancelFullScreen', 'mozCancelFullScreen', 'msExitFullscreen']) {
                    if (key in document) {
                        return true;
                    }
                }
                return false;
            }());

            if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                container.className = "unity-mobile";
                config.devicePixelRatio = 1;
            }
            loadingCover.style.display = "";
            var newInstance = null;

            const script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = () => {
                createUnityInstance(canvas, config, (progress) => {
                    spinner.style.display = "none";
                    progressBarEmpty.style.display = "";
                    progressBarFull.style.width = `${100 * progress}%`;
                }).then((unityInstance) => {
                    newInstance = unityInstance;
                    loadingCover.style.display = "none";
                    if (canFullscreen) {
                        if (!hideFullScreenButton) {
                            fullscreenButton.style.display = "";
                        }
                        fullscreenButton.onclick = () => {
                            newInstance.SetFullscreen(1);
                        };
                    }
                }).catch((message) => {
                    alert(message);
                });
            };

            document.body.appendChild(script);
        </script>
    </body>
</html>
